<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#79d7ee" />
  <title>Flappy Bird 3D</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #79d7ee; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; color: white; text-shadow: 0 3px 8px #17465b66; }
    #score { font-size: clamp(48px, 9vw, 76px); line-height: 1; font-weight: 900; letter-spacing: 2px; }
    #panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(340px, calc(100vw - 36px)); padding: 25px 24px; border: 3px solid #fff; border-radius: 22px; background: #17465be8; text-align: center; box-shadow: 0 12px 35px #17465b40; pointer-events: auto; }
    #panel h1 { margin: 0 0 8px; font-size: 30px; }
    #panel p { margin: 8px 0 20px; color: #e0f8ff; line-height: 1.5; }
    #start { border: 0; border-radius: 999px; padding: 13px 30px; background: #ffd34e; color: #503a00; font-size: 16px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 0 #d49d19; }
    #start:active { transform: translateY(2px); box-shadow: 0 2px 0 #d49d19; }
    #hint { position: absolute; bottom: 25px; font-size: 13px; font-weight: 700; color: #fff; text-align: center; }
    @media (max-height: 500px) { #hud { padding-top: 12px; } #panel { padding: 15px; } #panel h1 { font-size: 24px; } #panel p { margin-bottom: 12px; } #hint { bottom: 10px; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="hud">
    <div id="score">0</div>
    <section id="panel">
      <h1 id="panel-title">Flappy 3D</h1>
      <p id="panel-copy">Fly through the pipes and see how far you can go!<br>Tap, click or press Space to flap.</p>
      <button id="start">PLAY</button>
    </section>
    <div id="hint">SPACE / CLICK / TAP TO FLAP</div>
  </div>
  <script type="module">
    import * as THREE from "three";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x79d7ee);
    scene.fog = new THREE.Fog(0x79d7ee, 18, 38);
    const camera = new THREE.OrthographicCamera(-5.5, 5.5, 4.125, -4.125, 0.1, 100);
    camera.position.set(0, 0, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x6c9c55, 2.1));
    const sun = new THREE.DirectionalLight(0xffffff, 1.5);
    sun.position.set(-4, 8, 10);
    scene.add(sun);

    const bird = new THREE.Group();
    const yellow = new THREE.MeshStandardMaterial({ color: 0xffd34e, roughness: 0.55 });
    const orange = new THREE.MeshStandardMaterial({ color: 0xff8b35, roughness: 0.5 });
    const white = new THREE.MeshStandardMaterial({ color: 0xffffff });
    const black = new THREE.MeshStandardMaterial({ color: 0x172c3b, roughness: 0.35 });
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.38, 24, 18), yellow);
    body.scale.set(1.18, 0.9, 0.85);
    bird.add(body);
    const wing = new THREE.Mesh(new THREE.SphereGeometry(0.22, 18, 14), orange);
    wing.scale.set(1.1, 0.55, 0.55);
    wing.position.set(-0.12, -0.08, 0.3);
    bird.add(wing);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.075, 16, 12), white);
    eye.position.set(0.2, 0.13, 0.31);
    bird.add(eye);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 10), black);
    pupil.position.set(0.23, 0.13, 0.375);
    bird.add(pupil);
    const beak = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.32, 4), orange);
    beak.rotation.z = -Math.PI / 2;
    beak.position.set(0.48, -0.01, 0);
    bird.add(beak);
    bird.position.set(-1.5, 0, 1);
    scene.add(bird);

    const clouds = [];
    const cloudMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 });
    for (let i = 0; i < 6; i++) {
      const cloud = new THREE.Group();
      for (let j = 0; j < 3; j++) {
        const puff = new THREE.Mesh(new THREE.SphereGeometry(0.35 + (j === 1 ? 0.12 : 0), 16, 12), cloudMaterial);
        puff.position.set((j - 1) * 0.38, j === 1 ? 0.12 : 0, 0);
        cloud.add(puff);
      }
      cloud.position.set(-7 + i * 3.2, 2.5 + (i % 2) * 1.2, -3);
      scene.add(cloud);
      clouds.push(cloud);
    }

    const ground = new THREE.Mesh(new THREE.BoxGeometry(30, 0.55, 2), new THREE.MeshStandardMaterial({ color: 0x79c84b }));
    ground.position.set(0, -3.95, 0);
    scene.add(ground);
    const groundTop = new THREE.Mesh(new THREE.BoxGeometry(30, 0.12, 2.1), new THREE.MeshStandardMaterial({ color: 0xc9e86a }));
    groundTop.position.set(0, -3.65, 0.05);
    scene.add(groundTop);

    const pipeMaterial = new THREE.MeshStandardMaterial({ color: 0x36b94e, roughness: 0.65 });
    const pipeEdgeMaterial = new THREE.MeshStandardMaterial({ color: 0x238d3d, roughness: 0.65 });
    const pipes = [];
    const pipeWidth = 0.78;
    const gap = 2.05;
    function makePipe(x, gapY) {
      const group = new THREE.Group();
      const height = 8;
      const topHeight = 4 - (gapY + gap / 2);
      const bottomHeight = gapY - gap / 2 + 4;
      function addPipe(y, h, upsideDown) {
        const shaft = new THREE.Mesh(new THREE.BoxGeometry(pipeWidth, h, 0.8), pipeMaterial);
        shaft.position.y = y;
        group.add(shaft);
        const cap = new THREE.Mesh(new THREE.BoxGeometry(pipeWidth + 0.2, 0.22, 0.9), pipeEdgeMaterial);
        cap.position.y = upsideDown ? y - h / 2 + 0.12 : y + h / 2 - 0.12;
        group.add(cap);
      }
      if (topHeight > 0) addPipe(4 - topHeight / 2, topHeight, true);
      if (bottomHeight > 0) addPipe(-4 + bottomHeight / 2, bottomHeight, false);
      group.position.set(x, 0, 0);
      scene.add(group);
      const item = { group, x, gapY, scored: false };
      pipes.push(item);
      return item;
    }

    const scoreEl = document.getElementById("score");
    const panel = document.getElementById("panel");
    const panelTitle = document.getElementById("panel-title");
    const panelCopy = document.getElementById("panel-copy");
    const startButton = document.getElementById("start");
    let state = "ready";
    let velocity = 0;
    let score = 0;
    let lastTime = 0;
    let spawnTimer = 0;

    function resetGame() {
      pipes.forEach(p => scene.remove(p.group));
      pipes.length = 0;
      score = 0;
      scoreEl.textContent = "0";
      velocity = 0;
      spawnTimer = 0;
      bird.position.set(-1.5, 0, 1);
      bird.rotation.z = 0;
      makePipe(6.5, 0.1);
      makePipe(12.5, -0.45);
    }
    function startGame() {
      resetGame();
      state = "playing";
      panel.style.display = "none";
      flap();
    }
    function flap() {
      if (state === "playing") velocity = 5.3;
    }
    function endGame() {
      if (state !== "playing") return;
      state = "over";
      panelTitle.textContent = "Game Over!";
      panelCopy.innerHTML = "You scored <strong>" + score + "</strong> point" + (score === 1 ? "" : "s") + ".<br>Ready for another try?";
      startButton.textContent = "PLAY AGAIN";
      panel.style.display = "block";
    }
    startButton.addEventListener("click", startGame);
    function handleInput(event) {
      if (event && event.target === startButton) return;
      if (state === "ready" || state === "over") return;
      if (event && event.type === "keydown" && (event.code === "Space" || event.code === "ArrowUp")) {
        event.preventDefault();
        flap();
      } else if (!event || event.type !== "keydown") flap();
    }
    window.addEventListener("keydown", handleInput);
    renderer.domElement.addEventListener("pointerdown", handleInput);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.04);
      const elapsed = clock.elapsedTime;
      clouds.forEach((cloud, i) => {
        cloud.position.x -= delta * 0.22;
        if (cloud.position.x < -8) cloud.position.x = 9 + i * 0.35;
      });
      if (state === "playing") {
        velocity -= 12.5 * delta;
        bird.position.y += velocity * delta;
        bird.rotation.z = THREE.MathUtils.clamp(velocity * 0.075, -0.65, 0.5);
        wing.rotation.z = Math.sin(elapsed * 18) * 0.35;
        spawnTimer += delta;
        pipes.forEach(pipe => {
          pipe.group.position.x -= 3.1 * delta;
          const bx = bird.position.x;
          const by = bird.position.y;
          const birdRadius = 0.29;
          const withinX = Math.abs(pipe.group.position.x - bx) < pipeWidth / 2 + birdRadius;
          const outsideGap = by - birdRadius < pipe.gapY - gap / 2 || by + birdRadius > pipe.gapY + gap / 2;
          if (withinX && outsideGap) endGame();
          if (!pipe.scored && pipe.group.position.x + pipeWidth / 2 < bx) {
            pipe.scored = true;
            score++;
            scoreEl.textContent = String(score);
          }
        });
        for (let i = pipes.length - 1; i >= 0; i--) {
          if (pipes[i].group.position.x < -7) {
            scene.remove(pipes[i].group);
            pipes.splice(i, 1);
          }
        }
        if (spawnTimer > 2.15) {
          spawnTimer = 0;
          makePipe(7, THREE.MathUtils.randFloat(-0.65, 0.65));
        }
        if (bird.position.y < -3.35 || bird.position.y > 3.75) endGame();
      } else if (state === "ready") {
        bird.position.y = Math.sin(elapsed * 2.5) * 0.12;
        bird.rotation.z = Math.sin(elapsed * 2.5) * 0.05;
        wing.rotation.z = Math.sin(elapsed * 8) * 0.2;
      }
      renderer.render(scene, camera);
    }
    animate();

    function resize() {
      const aspect = window.innerWidth / window.innerHeight;
      const height = 8.25;
      camera.left = -height * aspect / 2;
      camera.right = height * aspect / 2;
      camera.top = height / 2;
      camera.bottom = -height / 2;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener("resize", resize);
  </script>
</body>
</html>

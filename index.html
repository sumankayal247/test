<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#79d7ee" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ctext y=%2250%22 font-size=%2250%22%3E%F0%9F%90%A6%3C/text%3E%3C/svg%3E" />
  <title>Flappy Bird 3D — City Flight</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #79d7ee; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; color: white; text-shadow: 0 3px 8px #10283d99; }
    #score { font-size: clamp(48px, 9vw, 76px); line-height: 1; font-weight: 900; letter-spacing: 2px; }
    #score-label { margin-top: 4px; font-size: 11px; font-weight: 900; letter-spacing: 4px; }
    #panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(350px, calc(100vw - 36px)); padding: 25px 24px; border: 2px solid #ffffffb8; border-radius: 22px; background: #10283de8; text-align: center; box-shadow: 0 14px 45px #07152266; pointer-events: auto; backdrop-filter: blur(10px); }
    #panel h1 { margin: 0 0 8px; font-size: 30px; }
    #panel p { margin: 8px 0 20px; color: #e0f8ff; line-height: 1.5; }
    #start { border: 0; border-radius: 999px; padding: 13px 30px; background: #ffd34e; color: #503a00; font-size: 16px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 0 #d49d19; }
    #start:active { transform: translateY(2px); box-shadow: 0 2px 0 #d49d19; }
    #hint { position: absolute; bottom: 25px; font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #fff; text-align: center; }
    #cycle { position: absolute; top: 22px; right: 20px; padding: 8px 12px; border: 1px solid #ffffff66; border-radius: 999px; background: #10283d55; font-size: 11px; font-weight: 900; letter-spacing: 1px; }
    @media (max-height: 500px) { #hud { padding-top: 12px; } #panel { padding: 15px; } #panel h1 { font-size: 24px; } #panel p { margin-bottom: 12px; } #hint { bottom: 10px; } #cycle { top: 10px; right: 10px; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="hud">
    <div id="score">0</div>
    <div id="score-label">SCORE</div>
    <div id="cycle">☀ DAYTIME</div>
    <section id="panel">
      <h1 id="panel-title">City Flier 3D</h1>
      <p id="panel-copy">Take flight above the city skyline!<br>Pass through the pipes, collect points and survive the changing sky.</p>
      <button id="start">PLAY</button>
    </section>
    <div id="hint">SPACE / CLICK / TAP TO FLAP</div>
  </div>
  <script type="module">
    import * as THREE from "three";

    const scene = new THREE.Scene();
    const daySky = new THREE.Color(0x78c9ed);
    const sunsetSky = new THREE.Color(0xf18b70);
    const nightSky = new THREE.Color(0x101b3d);
    scene.background = daySky.clone();
    scene.fog = new THREE.Fog(daySky.clone(), 19, 43);
    const camera = new THREE.OrthographicCamera(-5.5, 5.5, 4.125, -4.125, 0.1, 100);
    camera.position.set(0, 0, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xdff5ff, 0x617b54, 2.0);
    scene.add(hemi);
    const sunLight = new THREE.DirectionalLight(0xfff1d6, 2.0);
    sunLight.position.set(-5, 8, 10);
    scene.add(sunLight);

    // A layered skyline gives the play area depth without distracting from the pipes.
    const skyline = new THREE.Group();
    scene.add(skyline);
    const buildingMats = [0x526b83, 0x40566f, 0x65788b, 0x344a63, 0x718398].map(color =>
      new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0.05 })
    );
    const windowMats = [
      new THREE.MeshStandardMaterial({ color: 0xffe6a0, emissive: 0xffc85c, emissiveIntensity: 0.0 }),
      new THREE.MeshStandardMaterial({ color: 0xb7e9ff, emissive: 0x75cfff, emissiveIntensity: 0.0 })
    ];
    const windowMeshes = [];
    for (let i = 0; i < 26; i++) {
      const width = THREE.MathUtils.randFloat(0.48, 1.0);
      const height = THREE.MathUtils.randFloat(1.5, 4.5);
      const depth = THREE.MathUtils.randFloat(0.35, 0.75);
      const building = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), buildingMats[i % buildingMats.length]);
      building.position.set(-12.5 + i * 1.0, -3.48 + height / 2, -5.5 - (i % 3) * 0.25);
      skyline.add(building);
      // Rooftop details: water tanks, antennae and occasional stepped rooflines.
      if (i % 4 === 0) {
        const roof = new THREE.Mesh(new THREE.BoxGeometry(width * 0.35, 0.42, depth * 0.8), buildingMats[(i + 2) % buildingMats.length]);
        roof.position.set(building.position.x, building.position.y + height / 2 + 0.2, building.position.z);
        skyline.add(roof);
      }
      const cols = Math.max(1, Math.floor(width / 0.2));
      const rows = Math.max(2, Math.floor(height / 0.42));
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          if (Math.random() < 0.22) continue;
          const windowMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.075, 0.105), windowMats[Math.random() > 0.5 ? 0 : 1]);
          windowMesh.position.set(
            building.position.x - width / 2 + (col + 0.7) * (width / (cols + 0.4)),
            -3.48 + 0.35 + row * (height / (rows + 0.5)),
            building.position.z + depth / 2 + 0.012
          );
          skyline.add(windowMesh);
          windowMeshes.push(windowMesh);
        }
      }
    }

    // Ground strip and road details at the bottom of the scene.
    const ground = new THREE.Mesh(new THREE.BoxGeometry(30, 0.62, 2), new THREE.MeshStandardMaterial({ color: 0x426d49, roughness: 1 }));
    ground.position.set(0, -4.02, 0);
    scene.add(ground);
    const grass = new THREE.Mesh(new THREE.BoxGeometry(30, 0.12, 2.1), new THREE.MeshStandardMaterial({ color: 0x9acb62, roughness: 1 }));
    grass.position.set(0, -3.68, 0.05);
    scene.add(grass);
    const road = new THREE.Mesh(new THREE.BoxGeometry(30, 0.18, 1.2), new THREE.MeshStandardMaterial({ color: 0x293746, roughness: 1 }));
    road.position.set(0, -4.28, 0.12);
    scene.add(road);
    const roadLineMat = new THREE.MeshStandardMaterial({ color: 0xffd978, emissive: 0x6a4310, emissiveIntensity: 0.15 });
    for (let i = 0; i < 15; i++) {
      const dash = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.035, 0.02), roadLineMat);
      dash.position.set(-10 + i * 1.45, -4.28, 0.75);
      scene.add(dash);
    }

    // Sun, moon and stars share a slow, continuous day/night cycle.
    const sunOrb = new THREE.Mesh(new THREE.SphereGeometry(0.52, 24, 20), new THREE.MeshBasicMaterial({ color: 0xffe49a }));
    sunOrb.position.set(-3.8, 2.65, -8);
    scene.add(sunOrb);
    const moonOrb = new THREE.Mesh(new THREE.SphereGeometry(0.42, 24, 20), new THREE.MeshBasicMaterial({ color: 0xe4edff }));
    moonOrb.position.set(-3.8, 2.65, -8);
    scene.add(moonOrb);
    const starGeometry = new THREE.BufferGeometry();
    const starPositions = [];
    for (let i = 0; i < 100; i++) starPositions.push(THREE.MathUtils.randFloat(-13, 13), THREE.MathUtils.randFloat(-1.8, 5.2), -7.5);
    starGeometry.setAttribute("position", new THREE.Float32BufferAttribute(starPositions, 3));
    const stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.055, transparent: true, opacity: 0 }));
    scene.add(stars);

    const clouds = [];
    const cloudMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 });
    for (let i = 0; i < 6; i++) {
      const cloud = new THREE.Group();
      for (let j = 0; j < 3; j++) {
        const puff = new THREE.Mesh(new THREE.SphereGeometry(0.35 + (j === 1 ? 0.12 : 0), 16, 12), cloudMaterial);
        puff.position.set((j - 1) * 0.38, j === 1 ? 0.12 : 0, 0);
        cloud.add(puff);
      }
      cloud.position.set(-7 + i * 3.2, 2.5 + (i % 2) * 1.2, -3);
      scene.add(cloud);
      clouds.push(cloud);
    }

    // Detailed 3D house sparrow: warm brown crown, streaked wings, buff breast,
    // pale belly, facial markings, layered tail feathers and animated shoulder joints.
    const bird = new THREE.Group();
    const featherMat = (color, roughness = 0.88) => new THREE.MeshStandardMaterial({ color, roughness, side: THREE.DoubleSide });
    const sparrowBrown = featherMat(0x76503a);
    const crownBrown = featherMat(0x67432f);
    const darkBrown = featherMat(0x49372e);
    const wingBrown = featherMat(0x806047);
    const featherDark = featherMat(0x453b35);
    const buff = featherMat(0xd8b98b);
    const cream = featherMat(0xeee0c7);
    const black = new THREE.MeshStandardMaterial({ color: 0x171513, roughness: 0.32 });
    const white = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35 });
    const beakMat = new THREE.MeshStandardMaterial({ color: 0x29221b, roughness: 0.55 });
    const legMat = new THREE.MeshStandardMaterial({ color: 0xb77b42, roughness: 0.7 });

    function ellipsoid(parent, material, position, scale, segments = 24) {
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, segments, Math.max(12, segments - 6)), material);
      mesh.position.set(...position);
      mesh.scale.set(...scale);
      parent.add(mesh);
      return mesh;
    }
    function makeFeather(parent, material, length, width, position, angle = 0, z = 0) {
      const shape = new THREE.Shape();
      shape.moveTo(0, 0);
      shape.quadraticCurveTo(width * 0.52, length * 0.22, width * 0.42, length * 0.68);
      shape.quadraticCurveTo(width * 0.28, length * 0.96, 0, length);
      shape.quadraticCurveTo(-width * 0.28, length * 0.96, -width * 0.42, length * 0.68);
      shape.quadraticCurveTo(-width * 0.52, length * 0.22, 0, 0);
      const feather = new THREE.Mesh(new THREE.ShapeGeometry(shape, 8), material);
      feather.position.set(position[0], position[1], position[2] + z);
      feather.rotation.z = angle;
      parent.add(feather);
      return feather;
    }

    // Far wing sits behind the body; the near wing has individually layered flight feathers.
    const farWing = new THREE.Group();
    farWing.position.set(-0.18, 0.08, -0.28);
    bird.add(farWing);
    ellipsoid(farWing, sparrowBrown, [-0.17, -0.08, 0], [0.34, 0.16, 0.07]);
    for (let i = 0; i < 6; i++) makeFeather(farWing, i % 2 ? darkBrown : wingBrown, 0.43 + (i % 3) * 0.055, 0.105, [-0.18 - i * 0.055, -0.08, 0.015], -0.5 - i * 0.12);

    const torso = ellipsoid(bird, sparrowBrown, [-0.04, 0, 0], [0.43, 0.31, 0.29], 32);
    torso.rotation.z = -0.08;
    ellipsoid(bird, buff, [0.01, -0.12, 0.205], [0.34, 0.205, 0.105], 28);
    ellipsoid(bird, cream, [0.04, -0.22, 0.19], [0.27, 0.105, 0.075], 24);
    // Brown mantle and dark bib distinguish the familiar male house-sparrow markings.
    ellipsoid(bird, wingBrown, [-0.2, 0.16, 0.02], [0.27, 0.16, 0.25], 24);
    ellipsoid(bird, darkBrown, [0.27, 0.12, 0.205], [0.13, 0.17, 0.09], 22);
    ellipsoid(bird, crownBrown, [0.31, 0.31, 0], [0.255, 0.245, 0.245], 32);
    ellipsoid(bird, buff, [0.42, 0.16, 0.12], [0.17, 0.14, 0.16], 24);
    // Tail feathers fan out behind the body.
    for (let i = 0; i < 5; i++) makeFeather(bird, i % 2 ? darkBrown : sparrowBrown, 0.58, 0.095, [-0.34 - i * 0.035, -0.015, -0.11 + i * 0.055], -1.32 + i * 0.12);

    const wingNear = new THREE.Group();
    wingNear.position.set(-0.18, 0.09, 0.275);
    bird.add(wingNear);
    ellipsoid(wingNear, wingBrown, [-0.13, -0.04, 0], [0.31, 0.16, 0.075], 22);
    for (let i = 0; i < 7; i++) {
      const angle = -0.42 - i * 0.105;
      makeFeather(wingNear, i % 3 === 0 ? featherDark : (i % 2 ? sparrowBrown : wingBrown),
        0.47 + (i % 3) * 0.055, 0.105, [-0.12 - i * 0.045, -0.055, 0.018], angle);
    }
    // Two pale wing bars and small dark feather markings add natural plumage detail.
    for (let i = 0; i < 5; i++) {
      makeFeather(wingNear, buff, 0.22, 0.035, [-0.12 - i * 0.047, 0.025, 0.032], -0.95);
      makeFeather(wingNear, darkBrown, 0.19, 0.025, [-0.14 - i * 0.045, -0.035, 0.034], -0.95);
    }

    // Face: dark eye stripe, subtle pale eye ring, glossy eye and short conical seed beak.
    ellipsoid(bird, buff, [0.43, 0.31, 0.205], [0.145, 0.095, 0.045], 20);
    ellipsoid(bird, darkBrown, [0.405, 0.305, 0.246], [0.105, 0.045, 0.025], 20);
    ellipsoid(bird, cream, [0.43, 0.325, 0.27], [0.073, 0.073, 0.025], 20);
    ellipsoid(bird, black, [0.445, 0.326, 0.292], [0.045, 0.05, 0.025], 18);
    ellipsoid(bird, white, [0.46, 0.345, 0.312], [0.012, 0.014, 0.008], 12);
    const beak = new THREE.Mesh(new THREE.ConeGeometry(0.105, 0.25, 5), beakMat);
    beak.rotation.z = -Math.PI / 2;
    beak.position.set(0.62, 0.19, 0.08);
    bird.add(beak);
    // Thin legs and toes remain visible beneath the belly.
    for (const z of [-0.09, 0.12]) {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.022, 0.2, 8), legMat);
      leg.position.set(0.02, -0.34, z);
      bird.add(leg);
      for (let toe = -1; toe <= 1; toe++) {
        const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.015, 0.105, 7), legMat);
        foot.rotation.z = Math.PI / 2 + toe * 0.32;
        foot.position.set(0.07 + toe * 0.035, -0.435, z);
        bird.add(foot);
      }
    }
    bird.position.set(-1.5, 0, 1);
    bird.scale.setScalar(0.63);
    scene.add(bird);

    // A small street cat runs over and eats the sparrow if it lands on the ground.
    const cat = new THREE.Group();
    const catFur = new THREE.MeshStandardMaterial({ color: 0xc78345, roughness: 0.92 });
    const catCream = new THREE.MeshStandardMaterial({ color: 0xf0d7ad, roughness: 0.95 });
    const catDark = new THREE.MeshStandardMaterial({ color: 0x593b2b, roughness: 0.8 });
    const catEye = new THREE.MeshStandardMaterial({ color: 0x17251a, roughness: 0.3 });
    ellipsoid(cat, catFur, [0.05, 0, 0], [0.48, 0.23, 0.2], 24);
    ellipsoid(cat, catCream, [-0.03, -0.13, 0.17], [0.28, 0.09, 0.055], 20);
    const catHead = new THREE.Group();
    catHead.position.set(-0.34, 0.13, 0.02);
    cat.add(catHead);
    ellipsoid(catHead, catFur, [0, 0, 0], [0.25, 0.24, 0.21], 24);
    for (const side of [-1, 1]) {
      const ear = new THREE.Mesh(new THREE.ConeGeometry(0.105, 0.25, 4), catFur);
      ear.position.set(side * 0.15, 0.2, 0);
      ear.rotation.z = side * -0.2;
      catHead.add(ear);
      ellipsoid(catHead, catCream, [side * 0.105, 0.015, 0.19], [0.035, 0.055, 0.018], 12);
      ellipsoid(catHead, catEye, [side * 0.105, 0.035, 0.205], [0.018, 0.032, 0.012], 12);
    }
    ellipsoid(catHead, catCream, [-0.04, -0.09, 0.17], [0.13, 0.075, 0.07], 16);
    ellipsoid(catHead, catDark, [-0.07, -0.055, 0.235], [0.035, 0.025, 0.015], 12);
    // Nose, mouth, whisker pads and fine whiskers make the face more expressive.
    const catPink = new THREE.MeshStandardMaterial({ color: 0xd98782, roughness: 0.72 });
    ellipsoid(catHead, catPink, [-0.07, -0.075, 0.25], [0.035, 0.025, 0.018], 12);
    for (const side of [-1, 1]) {
      ellipsoid(catHead, catCream, [-0.13, -0.105, 0.22], [0.07, 0.045, 0.035], 14);
      for (let w = 0; w < 2; w++) {
        const whisker = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, 0.24, 6), catCream);
        whisker.position.set(-0.2, -0.09 - w * 0.035, 0.23);
        whisker.rotation.z = (w ? -0.2 : 0.2) * side;
        catHead.add(whisker);
      }
    }
    const catMouth = new THREE.Mesh(new THREE.TorusGeometry(0.045, 0.008, 6, 16, Math.PI), catDark);
    catMouth.position.set(-0.07, -0.13, 0.245);
    catMouth.rotation.z = Math.PI;
    catHead.add(catMouth);
    // Tabby forehead stripes and darker rings along the tail.
    for (let i = 0; i < 3; i++) {
      const stripe = new THREE.Mesh(new THREE.TorusGeometry(0.075 + i * 0.018, 0.012, 6, 16, Math.PI * 0.72), catDark);
      stripe.position.set(0.035 + i * 0.055, 0.17 - i * 0.018, 0.13);
      stripe.rotation.z = -0.2;
      catHead.add(stripe);
    }
    const catTail = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.065, 0.72, 10), catFur);
    catTail.position.set(0.48, 0.28, -0.02);
    catTail.rotation.z = -1.05;
    cat.add(catTail);
    const catLegs = [];
    for (const x of [-0.2, 0.28]) {
      for (const z of [-0.12, 0.13]) {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.045, 0.3, 10), catFur);
        leg.position.set(x, -0.2, z);
        cat.add(leg);
        const paw = new THREE.Mesh(new THREE.SphereGeometry(0.09, 14, 10), catCream);
        paw.scale.set(1.15, 0.58, 1);
        paw.position.set(x - 0.015, -0.34, z + 0.015);
        cat.add(paw);
        catLegs.push(leg);
      }
    }
    // Scale the cat up so it is unmistakably larger than the sparrow.
    cat.scale.setScalar(1.7);
    cat.position.set(8, -3.45, 2);
    cat.visible = false;
    scene.add(cat);
    let catPhase = "idle";
    let catEatTime = 0;

    // Stylized, non-graphic red droplets appear briefly after the bird disappears.
    const bloodParticles = [];
    const bloodMaterial = new THREE.MeshStandardMaterial({ color: 0xa81725, roughness: 0.65 });
    const bloodDarkMaterial = new THREE.MeshStandardMaterial({ color: 0x650d1b, roughness: 0.7 });
    const bloodGroup = new THREE.Group();
    bloodGroup.visible = false;
    scene.add(bloodGroup);
    function burstBlood() {
      bloodGroup.clear();
      bloodParticles.length = 0;
      bloodGroup.position.set(bird.position.x, -3.48, 1.4);
      for (let i = 0; i < 18; i++) {
        const radius = THREE.MathUtils.randFloat(0.025, 0.065);
        const drop = new THREE.Mesh(new THREE.SphereGeometry(radius, 10, 8), i % 4 === 0 ? bloodDarkMaterial : bloodMaterial);
        drop.scale.y = THREE.MathUtils.randFloat(1.1, 1.8);
        drop.position.set(THREE.MathUtils.randFloat(-0.32, 0.32), THREE.MathUtils.randFloat(0, 0.2), THREE.MathUtils.randFloat(-0.1, 0.2));
        bloodGroup.add(drop);
        bloodParticles.push({
          mesh: drop,
          velocity: new THREE.Vector3(THREE.MathUtils.randFloat(-1.5, 1.5), THREE.MathUtils.randFloat(0.7, 2.7), THREE.MathUtils.randFloat(-0.3, 0.3))
        });
      }
      bloodGroup.visible = true;
    }
    const pipeMaterial = new THREE.MeshStandardMaterial({ color: 0x279b42, roughness: 0.3, metalness: 0.08 });
    const pipeHighlight = new THREE.MeshStandardMaterial({ color: 0x68d879, roughness: 0.28, metalness: 0.06 });
    const pipeDark = new THREE.MeshStandardMaterial({ color: 0x176d35, roughness: 0.42 });
    const pipes = [];
    const pipeRadius = 0.43;
    const pipeWidth = pipeRadius * 2;
    const gap = 2.05;
    let nextPipeX = 6.5;

    function makePipe(x, gapY) {
      const group = new THREE.Group();
      const topHeight = Math.max(0.2, 4 - (gapY + gap / 2));
      const bottomHeight = Math.max(0.2, gapY - gap / 2 + 4);
      function addPipe(y, height, upsideDown) {
        // Cylinders, thick collars and raised rings give the obstacles a rounded 3D profile.
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(pipeRadius * 0.91, pipeRadius, height, 32, 1), pipeMaterial);
        shaft.position.y = y;
        shaft.castShadow = true;
        shaft.receiveShadow = true;
        group.add(shaft);

        const capY = upsideDown ? y - height / 2 + 0.13 : y + height / 2 - 0.13;
        const cap = new THREE.Mesh(new THREE.CylinderGeometry(pipeRadius * 1.23, pipeRadius * 1.23, 0.25, 32), pipeDark);
        cap.position.y = capY;
        cap.castShadow = true;
        group.add(cap);
        const lip = new THREE.Mesh(new THREE.CylinderGeometry(pipeRadius * 1.18, pipeRadius * 1.18, 0.12, 32), pipeHighlight);
        lip.position.y = capY + (upsideDown ? -0.105 : 0.105);
        group.add(lip);

        const collar = new THREE.Mesh(new THREE.CylinderGeometry(pipeRadius * 0.94, pipeRadius * 0.94, 0.075, 32), pipeHighlight);
        collar.position.y = upsideDown ? y + height * 0.28 : y - height * 0.28;
        group.add(collar);

        // A narrow raised highlight strip catches the changing city light.
        const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.055, Math.max(0.3, height - 0.35), 0.035), pipeHighlight);
        stripe.position.set(-pipeRadius * 0.48, y, pipeRadius * 0.86);
        group.add(stripe);
      }
      addPipe(4 - topHeight / 2, topHeight, true);
      addPipe(-4 + bottomHeight / 2, bottomHeight, false);
      group.position.set(x, 0, 0);
      scene.add(group);
      const item = { group, gapY, scored: false };
      pipes.push(item);
      return item;
    }

    function randomGapY(previousGapY = null) {
      let value = THREE.MathUtils.randFloat(-0.9, 0.9);
      // Avoid repeating the previous opening height; this also varies the flight path.
      if (previousGapY !== null && Math.abs(value - previousGapY) < 0.42) {
        value = value >= 0 ? value - 0.58 : value + 0.58;
      }
      return THREE.MathUtils.clamp(value, -1.0, 1.0);
    }
    // Short synthesized effects keep the game self-contained: no external audio files.
    let audioContext = null;
    function playTone(frequency, endFrequency, duration, type, volume) {
      try {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === "suspended") audioContext.resume();
        const now = audioContext.currentTime;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = type || "sine";
        oscillator.frequency.setValueAtTime(frequency, now);
        oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, endFrequency), now + duration);
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(now);
        oscillator.stop(now + duration);
      } catch (error) {
        // Audio is optional; gameplay continues if the browser blocks sound.
      }
    }
    function flapSound() {
      playTone(520, 250, 0.095, "triangle", 0.055);
    }
    function scoreSound() {
      playTone(760, 1120, 0.16, "sine", 0.065);
    }
    function crashSound() {
      playTone(190, 42, 0.42, "sawtooth", 0.09);
      setTimeout(() => playTone(90, 35, 0.28, "triangle", 0.055), 85);
    }

    const scoreEl = document.getElementById("score");
    const cycleEl = document.getElementById("cycle");
    const panel = document.getElementById("panel");
    const panelTitle = document.getElementById("panel-title");
    const panelCopy = document.getElementById("panel-copy");
    const startButton = document.getElementById("start");
    let state = "ready";
    let velocity = 0;
    let score = 0;
    let cycleTime = 0;
    const cycleDuration = 70;

    function resetGame() {
      pipes.forEach(p => scene.remove(p.group));
      pipes.length = 0;
      score = 0;
      scoreEl.textContent = "0";
      velocity = 0;
      bird.visible = true;
      cat.visible = false;
      bloodGroup.visible = false;
      bloodGroup.clear();
      bloodParticles.length = 0;
      catPhase = "idle";
      catEatTime = 0;
      catHead.rotation.z = 0;
      bird.position.set(-1.5, 0, 1);
      bird.rotation.z = 0;
      wingNear.rotation.z = 0;
      farWing.rotation.z = 0;
      nextPipeX = THREE.MathUtils.randFloat(6.2, 7.2);
      let previousGapY = randomGapY();
      makePipe(nextPipeX, previousGapY);
      for (let i = 1; i < 3; i++) {
        nextPipeX += THREE.MathUtils.randFloat(6.4, 7.6);
        previousGapY = randomGapY(previousGapY);
        makePipe(nextPipeX, previousGapY);
      }
    }
    function startGame() {
      resetGame();
      state = "playing";
      panel.style.display = "none";
      flap();
    }
    function flap() {
      if (state !== "playing") return;
      velocity = 5.3;
      bird.rotation.z = 0.28;
      flapSound();
    }
    function endGame(reason = "") {
      if (state !== "playing") return;
      state = "over";
      crashSound();
      if (reason === "ground") {
        cat.visible = true;
        cat.position.set(8, -3.45, 2);
        catPhase = "running";
        catEatTime = 0;
        bird.visible = true;
      }
      panelTitle.textContent = "Flight Over!";
      panelCopy.innerHTML = "You scored <strong>" + score + "</strong> point" + (score === 1 ? "" : "s") + ".<br>Take off again and beat your best!";
      startButton.textContent = "FLY AGAIN";
      panel.style.display = "block";
    }
    startButton.addEventListener("click", startGame);
    function handleInput(event) {
      if (event && event.target === startButton) return;
      if (event && event.type === "keydown") {
        if (event.code !== "Space" && event.code !== "ArrowUp") return;
        event.preventDefault();
      }
      if (state === "ready" || state === "over") return;
      flap();
    }
    window.addEventListener("keydown", handleInput);
    renderer.domElement.addEventListener("pointerdown", handleInput);

    const clock = new THREE.Clock();
    const dayColor = new THREE.Color();
    const nightColor = new THREE.Color();
    function updateDayNight(elapsed) {
      const phase = (elapsed / cycleDuration) % 1;
      const daylight = (Math.cos(phase * Math.PI * 2 - Math.PI) + 1) / 2;
      const sunset = Math.max(0, 1 - Math.abs(daylight - 0.5) * 4);
      dayColor.copy(nightSky).lerp(daySky, daylight);
      dayColor.lerp(sunsetSky, sunset * 0.48);
      scene.background.copy(dayColor);
      scene.fog.color.copy(dayColor);
      hemi.intensity = 0.45 + daylight * 1.75;
      sunLight.intensity = 0.25 + daylight * 2.0;
      sunOrb.material.color.setHex(sunset > 0.45 ? 0xffa16b : 0xffe49a);
      sunOrb.visible = daylight > 0.08;
      moonOrb.visible = daylight < 0.48;
      stars.material.opacity = THREE.MathUtils.clamp((0.48 - daylight) * 2.4, 0, 0.92);
      windowMats[0].emissiveIntensity = (1 - daylight) * 1.45;
      windowMats[1].emissiveIntensity = (1 - daylight) * 0.9;
      cycleEl.textContent = daylight > 0.62 ? "☀ DAYTIME" : daylight > 0.38 ? "🌇 SUNSET" : "☾ NIGHT";
      cycleEl.style.background = daylight < 0.38 ? "#08152e88" : "#10283d55";
      sunOrb.position.x = -4 + phase * 8;
      moonOrb.position.x = 4 - phase * 8;
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.04);
      const elapsed = clock.elapsedTime;
      updateDayNight(elapsed);
      clouds.forEach((cloud, i) => {
        cloud.position.x -= delta * 0.22;
        if (cloud.position.x < -8) cloud.position.x = 9 + i * 0.35;
      });
      // Gentle wing movement is always visible, even while waiting on the start screen.
      const wingBeat = Math.sin(elapsed * (state === "playing" ? 24 : 8));
      wingNear.rotation.z = wingBeat * (state === "playing" ? 0.82 : 0.38);
      farWing.rotation.z = -wingBeat * (state === "playing" ? 0.68 : 0.3);
      if (state === "playing") {
        velocity -= 12.5 * delta;
        bird.position.y += velocity * delta;
        bird.rotation.z = THREE.MathUtils.clamp(velocity * 0.075, -0.65, 0.5);
        pipes.forEach(pipe => {
          pipe.group.position.x -= 3.1 * delta;
          const bx = bird.position.x;
          const by = bird.position.y;
          const birdRadius = 0.25;
          const withinX = Math.abs(pipe.group.position.x - bx) < pipeRadius + 0.35;
          const outsideGap = by - birdRadius < pipe.gapY - gap / 2 || by + birdRadius > pipe.gapY + gap / 2;
          if (withinX && outsideGap) endGame();
          if (!pipe.scored && pipe.group.position.x + pipeWidth / 2 < bx) {
            pipe.scored = true;
            score++;
            scoreEl.textContent = String(score);
            scoreSound();
          }
        });
        for (let i = pipes.length - 1; i >= 0; i--) {
          if (pipes[i].group.position.x < -7) {
            scene.remove(pipes[i].group);
            pipes.splice(i, 1);
          }
        }
        if (pipes.length > 0 && pipes[pipes.length - 1].group.position.x < 8) {
          const previousGapY = pipes[pipes.length - 1].gapY;
          nextPipeX = pipes[pipes.length - 1].group.position.x + THREE.MathUtils.randFloat(6.4, 7.6);
          makePipe(nextPipeX, randomGapY(previousGapY));
        }
        if (bird.position.y < -3.35) endGame("ground");
        else if (bird.position.y > 3.75) endGame();
      } else if (state === "ready") {
        bird.position.y = Math.sin(elapsed * 2.5) * 0.12;
        bird.rotation.z = Math.sin(elapsed * 2.5) * 0.05;
      }
      if (catPhase === "running") {
        cat.position.x = Math.max(bird.position.x + 0.52, cat.position.x - 5.2 * delta);
        const runBeat = Math.sin(elapsed * 19);
        catLegs.forEach((leg, i) => { leg.rotation.z = runBeat * (i % 2 ? 0.55 : -0.55); });
        if (cat.position.x <= bird.position.x + 0.52) {
          catPhase = "eating";
          catEatTime = 0;
          catLegs.forEach(leg => { leg.rotation.z = 0; });
        }
      } else if (catPhase === "eating") {
        catEatTime += delta;
        catHead.rotation.z = Math.sin(catEatTime * 15) * 0.22 - 0.18;
        if (catEatTime > 0.55 && bird.visible) {
          bird.visible = false;
          catHead.rotation.z = -0.12;
          burstBlood();
        }
      }
      if (bloodGroup.visible) {
        bloodParticles.forEach(particle => {
          particle.velocity.y -= 5.5 * delta;
          particle.mesh.position.addScaledVector(particle.velocity, delta);
          particle.mesh.scale.multiplyScalar(Math.max(0, 1 - delta * 0.45));
        });
        if (catEatTime > 2.8) bloodGroup.visible = false;
      }
      renderer.render(scene, camera);
    }
    animate();

    function resize() {
      const aspect = window.innerWidth / window.innerHeight;
      const height = 8.25;
      camera.left = -height * aspect / 2;
      camera.right = height * aspect / 2;
      camera.top = height / 2;
      camera.bottom = -height / 2;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener("resize", resize);
  </script>
</body>
</html>
